name: Deploy Promacson Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest
    environment: promacson-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare release
        shell: bash
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          mkdir -p release

          cp -r dist release/dist
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json

          cat > release/.env <<EOF
          NODE_ENV=$NODE_ENV
          PORT=$PORT

          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD

          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRES_IN=$JWT_EXPIRES_IN

          CORS_ORIGIN=$CORS_ORIGIN
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: promacson-release
          path: release
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Copy release to VM
    needs: build

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Clean staging folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\deploy\promacson" | Out-Null

          Remove-Item "C:\deploy\promacson\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item "C:\deploy\promacson\.env" `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: promacson-release
          path: C:\deploy\promacson

      - name: Copy release to application folder
        shell: powershell
        run: |
          $AppPath = "C:\apps\promacson"
          $ReleasePath = "C:\deploy\promacson"

          New-Item -ItemType Directory -Force -Path $AppPath | Out-Null

          Remove-Item "$AppPath\dist" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Copy-Item "$ReleasePath\dist" `
            "$AppPath\dist" `
            -Recurse `
            -Force

          Copy-Item "$ReleasePath\package.json" `
            "$AppPath\package.json" `
            -Force

          Copy-Item "$ReleasePath\package-lock.json" `
            "$AppPath\package-lock.json" `
            -Force

          Copy-Item "$ReleasePath\.env" `
            "$AppPath\.env" `
            -Force

      - name: Install production dependencies
        shell: powershell
        working-directory: C:\apps\promacson
        run: |
          npm ci --omit=dev

      - name: Deployment complete
        shell: powershell
        run: |
          Write-Host "Release copiado correctamente a C:\apps\promacson"
          Write-Host "PM2 no fue modificado."
