name: Test PM2

on:
  workflow_dispatch:

jobs:
  test-pm2:
    runs-on:
      - self-hosted
      - Windows
      - X64

    environment: production

    steps:
      - name: Test PM2 local
        shell: powershell
        working-directory: C:\apps\promacson
        run: |
          npm install pm2
          npx pm2 --version
