name: Test VM Runner

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on:
      - self-hosted
      - Windows
      - X64

    environment: production

    steps:
      - name: Check tools
        shell: powershell
        run: |
          Write-Host "=== Node ==="
          where.exe node
          node --version

          Write-Host "=== NPM ==="
          where.exe npm
          npm --version

          Write-Host "=== PM2 ==="
          where.exe pm2
          pm2 --version
