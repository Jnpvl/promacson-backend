name: Deploy Promacson Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare release
        run: |
          mkdir release
          cp -r dist release/dist
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: promacson-release
          path: release
          retention-days: 3

  deploy:
    name: Deploy to VM
    needs: build

    runs-on:
      - self-hosted
      - Windows
      - X64

    environment: production

    steps:
      - name: Clean deploy staging folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\deploy\promacson" | Out-Null

          Remove-Item "C:\deploy\promacson\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: promacson-release
          path: C:\deploy\promacson

      - name: Copy release to application folder
        shell: powershell
        run: |
          $AppPath = "C:\apps\promacson"
          $ReleasePath = "C:\deploy\promacson"

          New-Item -ItemType Directory -Force -Path $AppPath | Out-Null

          Remove-Item "$AppPath\dist" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Copy-Item "$ReleasePath\dist" `
            "$AppPath\dist" `
            -Recurse `
            -Force

          Copy-Item "$ReleasePath\package.json" `
            "$AppPath\package.json" `
            -Force

          Copy-Item "$ReleasePath\package-lock.json" `
            "$AppPath\package-lock.json" `
            -Force

      - name: Validate environment configuration
        shell: powershell
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          $required = @(
            "NODE_ENV",
            "PORT",
            "DB_HOST",
            "DB_PORT",
            "DB_NAME",
            "DB_USER",
            "DB_PASSWORD",
            "JWT_SECRET",
            "JWT_EXPIRES_IN",
            "CORS_ORIGIN"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "Falta la variable requerida: $name"
              exit 1
            }

            if ($name -eq "DB_PASSWORD" -or $name -eq "JWT_SECRET") {
              Write-Host "$name = configurado"
            }
            else {
              Write-Host "$name = $value"
            }
          }

      - name: Create environment file
        shell: powershell
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          @"
          NODE_ENV=$env:NODE_ENV
          PORT=$env:PORT
          DB_HOST=$env:DB_HOST
          DB_PORT=$env:DB_PORT
          DB_NAME=$env:DB_NAME
          DB_USER=$env:DB_USER
          DB_PASSWORD=$env:DB_PASSWORD
          JWT_SECRET=$env:JWT_SECRET
          JWT_EXPIRES_IN=$env:JWT_EXPIRES_IN
          CORS_ORIGIN=$env:CORS_ORIGIN
          "@ | Set-Content `
            -Path "C:\apps\promacson\.env" `
            -Encoding UTF8

      - name: Install production dependencies
        shell: powershell
        working-directory: C:\apps\promacson
        run: |
          npm ci --omit=dev
          npm install pm2 --no-save

      - name: Start or reload backend
        shell: powershell
        working-directory: C:\apps\promacson
        run: |
          cmd /c "npx pm2 describe promacson-backend >NUL 2>&1"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Backend existente. Recargando..."
            npx pm2 reload promacson-backend --update-env
          }
          else {
            Write-Host "Primer deploy. Iniciando backend..."
            npx pm2 start dist/index.js --name promacson-backend
          }

          npx pm2 save

      - name: Show PM2 status
        shell: powershell
        working-directory: C:\apps\promacson
        run: |
          npx pm2 status
